# The whole integration passes mypy --strict (quality_scale.yaml: strict-typing).
# Keep it that way: annotate new code rather than adding ignore_errors sections.
# CI runs: mypy custom_components/geodrops_rachio
[mypy]
python_version = 3.14
strict = True
explicit_package_bases = True

# Home Assistant re-exports names without __all__ (e.g. BinarySensorDeviceClass
# from homeassistant.components.binary_sensor); integrations import them so.
[mypy-homeassistant.*]
implicit_reexport = True
