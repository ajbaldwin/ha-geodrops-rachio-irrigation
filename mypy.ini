# mypy --strict, adopted a package at a time (quality_scale.yaml: strict-typing).
# A section with ignore_errors marks code not converted yet; delete it once
# that code passes. CI runs: mypy custom_components/geodrops_rachio
[mypy]
python_version = 3.14
strict = True
explicit_package_bases = True


# Home Assistant re-exports names without __all__ (e.g. BinarySensorDeviceClass
# from homeassistant.components.binary_sensor); integrations import them so.
[mypy-homeassistant.*]
implicit_reexport = True
