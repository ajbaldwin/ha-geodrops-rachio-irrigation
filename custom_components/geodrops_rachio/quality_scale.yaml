# Home Assistant integration quality scale: where this integration stands.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/checklist
# Each rule is `done`, `todo` or `exempt` (with a comment saying why).
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions; its controls are buttons.
  appropriate-polling:
    status: done
    comment: >-
      No entity polls. Rachio zone data is cached for 6 h; the overnight
      forecast refreshes hourly.
  brands: done
  common-modules:
    status: done
    comment: >-
      Entities share a base class in entity.py; the runtime data and zone
      coordinator live in coordinator.py.
  config-flow-test-coverage:
    status: done
    comment: config_flow.py is fully covered.
  config-flow:
    status: done
    comment: >-
      Every field has a data_description and the options menu is translated.
      The settings (Active Watering Calibration, advanced overrides) are in
      entry.options; the API key, bindings and zones are setup data in
      entry.data, which Configure edits like a reconfigure step would.
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-conditions:
    status: exempt
    comment: No device conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No device triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: >-
      Setup must not wait on the Rachio cloud: the scheduler waters from the
      zones' stored runtimes, and the API key only refreshes them. Setup checks
      the key in the background and starts reauthentication if Rachio rejects
      it.
  unique-config-entry:
    status: done
    comment: One entry per Home Assistant, keyed to the Rachio account id.

  # Silver
  action-exceptions:
    status: exempt
    comment: No service actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: >-
      README "Configuration reference": the Configure sections and the main
      advanced-override keys; the calibration keys are documented in
      brain/config.py.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >-
      The scheduler's entities are computed locally and are always available.
      The forecast sensors are unavailable while the weather entity cannot
      answer, and a zone's Soil moisture and Deficit while its moisture sensor
      is unavailable. A Rachio outage leaves nothing unavailable: zones water
      from their stored runtimes, and the refill depths fall back to the ones
      stored at setup.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      A Rachio outage and a forecast that cannot be read are each logged once
      when they start and once when they end.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >-
      99% overall, every module above 95% (2026-10-01). Measure with
      `bash tools/test.sh -q --cov=custom_components/geodrops_rachio
      --cov-report=term-missing`.

  # Gold
  devices: done
  diagnostics:
    status: done
    comment: >-
      The entry (API key redacted), the scheduler's records and stored
      documents, and the Rachio zone cache.
  discovery:
    status: exempt
    comment: A cloud account bound to entities of other integrations; nothing to discover.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: Zones added in Configure get their devices on the reload that follows.
  entity-category:
    status: done
    comment: >-
      Reset, Refresh, Drought level and the zones' Exclude are configuration;
      the calibration, refill-depth and overnight-weather sensors are
      diagnostic.
  entity-device-class:
    status: done
    comment: >-
      Overnight weather sensors are temperature, humidity and wind speed (shown
      in the home's units; the scheduler converts what it reads). Moisture,
      durations, timestamps and the running indicator have classes. Refill
      depth has none on purpose: a distance class would show 7 mm as 0.28 in.
      Efficacy, deficit and the record counts have no matching class.
  entity-disabled-by-default:
    status: done
    comment: >-
      No entity qualifies: the overnight weather sensors are what the 06:00
      calibration reads, and the rest are the integration's controls and
      results.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: >-
      Reconfigure replaces the Rachio API key (same account); everything else
      set up in the wizard is changed under Configure.
  repair-issues:
    status: done
    comment: >-
      An issue lists entities picked in setup that no longer exist. Reauth
      covers a rejected API key.
  stale-devices:
    status: done
    comment: Devices of removed zones are purged on setup.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: done
    comment: >-
      mypy.ini runs the whole integration under mypy --strict with no
      exemptions, and CI runs mypy on every push.
